name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: PHP syntax check
        run: |
          find src tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Standalone exporter CLI smoke test
        run: php tools/export-dataset.php --help

      - name: Golden RAtaxes compatibility tests
        run: php tests/golden.php
